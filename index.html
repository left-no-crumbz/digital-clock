<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <!-- <script defer async src="./app.js"></script> -->
    <!-- <link rel="stylesheet" href="./css/styles.css"> -->
     <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        * {
            padding: 0;
            margin: 0;
        }

        @font-face {
            font-family: 'alarm_clockregular';
            src: url('../alarm-clock-font/alarm_clock-webfont.woff2') format('woff2'),
                url('../alarm-clock-font/alarm_clock-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            display: flex;
            height: 100dvh;
            justify-content: center;
            align-items: center;
            font-family: "alarm_clockregular", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: green;
            background-color: black;
        }

        .container {
            background-color: gray;
            border-radius: 0.75rem;
            width: 450px;
            height: 200px;
            background-color: rgb(39, 39, 39);

            display: grid;
            place-items: center;
            align-content: center;
            grid-template-columns: 1fr;
            grid-template-rows: 100px 50px;
        }

        .row {
            display: flex;
            height: 100px;
        }

        #hours,
        #minutes {
            line-height: 7rem;
            font-size: 7rem;
        }

        #seconds {
            font-size: 2rem;
            align-self: flex-end;
        }

        .date {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        #date {
            text-transform: uppercase;
            font-size: 1.5rem;

        }

        #day {
            margin-left: auto;
            text-transform:uppercase;
            font-size: 1.5rem;
        }

        #period {
            font-size: 2rem;
            align-self: flex-start;
            margin-bottom: 2rem;
        }
     </style>
</head> 
<body>
    <div class="container">
        
        <div class="row">
            <div id="hours"></div>
            <div id="minutes"></div>
            <div class="column">
                <div id="period"></div>
                <div id="seconds"></div>
            </div>
        </div>

        <div class="date">
            <div id="date"></div>
            <div id="day"></div>
        </div>
    </div>
</body>
<script>
    
const time = document.getElementById("time");
const divHours = document.getElementById("hours");
const divMinutes = document.getElementById("minutes");
const divSeconds = document.getElementById("seconds");
const divPeriod = document.getElementById("period");
const divDate = document.getElementById("date");
const divDay = document.getElementById("day");

function getDay() {
    const date = new Date();
    const weekDay = date.getDay();
    switch (weekDay) {
        case 0: return "MONDAY";    
        case 1: return "TUESDAY";    
        case 2: return "WEDNESDAY";    
        case 3: return "THURSDAY";    
        case 4: return "FRIDAY";    
        case 5: return "SATURDAY";    
        case 6: return "SUNDAY";    
    }
}
function getMonth() {
    const date = new Date();
    const month = date.getMonth();
    switch(month) {
        case 0: return "January";
        case 1: return "February"
        case 2: return "March";
        case 3: return "April";
        case 4: return "May";
        case 5: return "June";
        case 6: return "July";
        case 7: return "August";
        case 8: return "September"
        case 9: return "October";
        case 10: return "November";
        case 11: return "December";
    }

}

function getTime() {
    const date = new Date();
    let hours = date.getHours();
    const minutes = date.getMinutes();
    const seconds = date.getSeconds();
    const period = hours >= 12 ? "PM" : "AM"
    const month = getMonth();
    const dayNum = date.getDate();
    const year = date.getFullYear();
    const weekDay = getDay();
    hours = hours % 12;
    hours = hours ? hours : 12;
    const padHours = String(hours).padStart(2, "0");
    const padMinutes = String(minutes).padStart(2, "0");
    const padSeconds = String(seconds).padStart(2, "0");
    divHours.textContent = `${padHours}:`;
    divMinutes.textContent = `${padMinutes}`;
    divSeconds.textContent = `${padSeconds}`;
    divPeriod.textContent = `${period}`;
    divDate.textContent = `${month} ${dayNum} ${year}`;
    divDay.textContent = `${weekDay}`;
}

setInterval(getTime, 1000);
</script>
</html>
